# Device name for players: ampdac
# Volume on this path is unity. Use the DAC's own control.

pcm.ampdac {
    type ampdac
    hint {
        show on
        # Strawberry keeps a device only when IOID is exactly "Output".
        # ALSA has no ioid key for a virtual PCM; the marker rides in the
        # description and snd_device_name_get_hint splits it back out.
        description "ampdac USB DAC|IOIDOutput"
    }
}

# Audacity's PortAudio lists every top-level pcm name, so a second
# definition showed up as "ampdac_card" and opened the same transport.
# Pick a DAC by id with an explicit plugin block if you ever need it:
#   pcm.ampdac { type ampdac vid 5418 pid 34269 }
